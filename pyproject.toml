[project]
name = "workflow-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paolo Litta", email = "paolo.litta.br@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pydantic-ai>=2.56.0",
    "pydantic-ai-harness>=0.56.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
workflow-agent = "workflow_agent:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
